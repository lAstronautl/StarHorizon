# code/modules/atmospherics/machinery/pipe.dm -- the flexible "wanders
# around" pipe segment: its own New() turns a diagonal dir into a bend
# (initialize_directions = dir for anything that isn't a cardinal pair),
# exactly like tgstation's own disposalpipe/segment bend convention (see
# that rule in Tools/dmm2yml/mapping/entities.yml). byDir rotations below
# are derived from pipefitting.py's own _bend_facing() (SS14's
# GasPipeBend at its default "south" facing connects S+W), not guessed:
# dir 5 (connects N+E) -> facing north, 6 (S+E) -> east, 9 (N+W) -> west,
# 10 (S+W) -> south. Every /heat_exchanging, /insulated, and /insulated/
# cold subtype inherits this same rule (and its byDir) by not overriding
# it, since none of them override New() either. This loses the dynamic
# gas-pipe auto-fitter's bend/colour logic (gaspipes.py only parses
# tgstation's own "smart/<shape>/<color>" path shape) -- a fixed-shape
# placement instead, with only the per-instance dir driving the bend.
/obj/machinery/atmospherics/pipe/simple:
  entity: GasPipeStraight
  byDir:
    5: { entity: GasPipeBend, dir: 1 }
    6: { entity: GasPipeBend, dir: 4 }
    9: { entity: GasPipeBend, dir: 8 }
    10: { entity: GasPipeBend, dir: 2 }

# code/modules/atmospherics/machinery/pipe.dm -- a fixed T-shaped
# junction (unlike plain /simple above, its own name and shape don't
# bend via dir); direct SS14 match.
