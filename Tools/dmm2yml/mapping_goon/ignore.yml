# Goonstation -> SS14 (this fork). Prefixes, matched down the path tree.
#
# SS14 has no areas at all: rooms are defined by their walls and the station
# map prototype, not by an area object covering the tiles. Same reasoning as
# the tgstation mapping set's own /area line.
- /area

# code/obj/landmark.dm -- invisible round-start/game-logic markers (spawn
# points, gamemode anchors, ...), never rendered in play.
- /obj/landmark

# code/modules/mapping/helpers/* access-setting variants -- self-deleting
# init-time helpers (deleted_on_start = TRUE, code/modules/mapping/
# _helper_parent.dm) with no visible effect, same reasoning as tgstation's
# own mapping_helpers. NOT a blanket /obj/mapping_helper: wingrille_spawn
# under that same prefix spawns real, visible structure and is mapped in
# entities.yml instead -- see check_ignore_does_not_swallow_mappings.
- /obj/mapping_helper/access
- /obj/cable

# code/obj/decal.dm, code/obj/map/light.dm -- pure invisible point-light
# emitters with no icon/sprite of their own (map/light.dm's own comment:
# "meant to replace those fucking instanced glow decals" -- same class of
# thing as /obj/decal/glow, just the newer version), confirmed by reading
# both classes directly: neither sets an icon file, only a /datum/light
# attached in New(). Never rendered in play, same reasoning as /obj/
# landmark above.
- /obj/decal/glow
- /obj/map/light

# WorkInProgress/actuallyKeelinsStuff.dm -- literally "nothing": blank
# icon_state, opacity/density both FALSE, PLANE_ABOVE_LIGHTING. Confirmed
# non-rendered by its own name/icon, same reasoning as /obj/landmark.
- /obj/decal/nothing

# code/modules/fluids/fluid_objects.dm -- a fluid-mechanics flow-
# restricting gate; sets INVIS_ALWAYS_ISH in New(), never actually seen
# in play.
- /obj/channel

# --- neon.dmm (full playable station): bulk invisible/no-visible-effect
# marker families, confirmed by reading each base class directly. ---

# code/obj/machinery/navbeacon.dm -- an underfloor (level=1) bot-
# navigation radio beacon; calls hide(T.intact) in New(), so it's never
# visible once the floor above it is intact. Covers every /mule, /tour,
# and /guardbotsecbot_circularpatrol routing variant.
- /obj/machinery/navbeacon

# code/modules/mapping/helpers/mailtag_spawn.dm -- "Configures a mail
# chute or junction with its mail tag, then destroys itself"; purely
# configures an already-placed object, no structure of its own, same
# reasoning as /obj/mapping_helper/access above.
- /obj/mapping_helper/mailtag

# code/modules/mapping/helpers/button_helpers.dm -- "door button helper";
# configures an already-placed door/door_control, no structure of its own.
- /obj/mapping_helper/button

# code/modules/economy/supply_misc.dm -- a cargo-drop-zone marker;
# INVIS_ALWAYS, confirmed non-rendered.
- /obj/marker/supplymarker

# code/modules/fluids/fluid_objects.dm -- a periodic fluid spawner;
# invisibility = INVIS_ADVENTURE, confirmed non-rendered.
- /obj/fluid_spawner

# code/modules/mapping/helpers/airlock_helpers.dm, beaker_spawn.dm --
# self-configuring linkage/content helpers for an already-placed airlock
# or dispenser; no structure of their own, same reasoning as the other
# mapping_helper entries above.
- /obj/mapping_helper/airlock/cycler/manual
- /obj/mapping_helper/glassware_spawn
