# SS13 paths dropped on purpose. Prefixes, matched down the path tree.
#
# Everything here is a decision already made, not a guess -- delete a line and
# those paths come back in the scan report for you to decide on individually.

# Lives in the same source file as mapping_helpers above (code/modules/
# mapping/mapping_helpers.dm) and does the same job for baseturfs
# specifically -- "Set the baseturfs of every turf in the /area/ it is
# placed", blank icon_state, nothing to render.
- /obj/effect/baseturf_helper

# /obj/effect/gibspawner: icon_state exists "for the map editor" only
# (source comment) -- at runtime it spawns randomized blood-gib decals and
# self-deletes (return INITIALIZE_HINT_QDEL), the same spawn-then-vanish
# pattern as mapping_helpers above. The gibs it produces are randomized
# scatter, not something a static conversion could place correctly anyway.
- /obj/effect/gibspawner

# SS14 has no areas at all: rooms are defined by their walls and by the station
# map prototype, not by an area object covering the tiles. All 171 area paths of
# a typical /tg/ station would otherwise land in the report with nothing useful
# to map them to.
- /area

# Atmospheric pipes and power cables. SS13 and SS14 build these networks
# differently enough that a converted layout is worth less than the time spent
# untangling it -- the pipes carry layers, colours and directions that do not
# survive, and the cable net has to be re-run against SS14's power model anyway.
# Dropping them leaves clean floors to lay new ones on. On a /tg/ MetaStation
# this is about a third of all objects: 5857 pipes, 3631 cables.
#
# The machines that sit on these networks (vents, scrubbers, pumps, injectors)
# are still converted -- they are placed correctly and only need connecting up.
- /obj/machinery/atmospherics/pipe
- /obj/structure/cable
- /obj/machinery/power/terminal

# tgstation's plumbing subsystem: a second, separate pipe network (fluid
# ducts, code/modules/plumbing/) that moves chemistry/hydroponics reagents
# between machines, layered independently of the atmos pipe network above.
# This fork has no matching reagent-piping system at all (checked
# Resources/Prototypes for "plumbing"/"ductnet"/"fluid duct", nothing but an
# unrelated substring hit) -- same reasoning as the atmos pipes/cables above,
# not worth converting a network layout for a system that doesn't exist here.
# The item form (a wrenchable stack you place to build the network) is the
# same absent system.
- /obj/machinery/duct
- /obj/item/stack/ducts

# Map-init helpers. They tag or reconfigure the object next to them (set an
# airlock's access, break a floor tile, wire an atmos device) and then delete
# themselves -- confirmed in tgstation's own code/modules/mapping/mapping_helpers.dm,
# every one of these calls qdel(src) once its effect is applied and none of
# them is ever rendered. There is nothing here for a converted map to keep.
- /obj/effect/mapping_helpers

# SS13 features this fork's SS14 does not implement at all -- not renamed, not
# hidden elsewhere, genuinely absent from Resources/Prototypes. A newscaster is
# a physical bulletin board object; nav beacons and status displays are
# wayfinding/announcement hardware. None of the three exist here.
- /obj/machinery/newscaster
- /obj/machinery/navbeacon
- /obj/machinery/status_display

# Checked from several angles (exact id, keyword search, direct grep for the
# id pattern) and confirmed genuinely absent from this fork's SS14, the same
# way newscaster/navbeacon/status_display were above -- not renamed, not
# hidden, the feature or fixture just isn't implemented.
- /obj/machinery/light_switch
- /obj/machinery/requests_console
- /obj/machinery/digital_clock
- /obj/machinery/photocopier
- /obj/machinery/iv_drip
- /obj/machinery/shower
- /obj/structure/ladder
- /obj/structure/transit_tube
- /obj/structure/transport/linear
- /obj/structure/marker_beacon
- /obj/item/pai_card
- /obj/item/newspaper

# Every /obj/effect/landmark is invisible by construction --
# invisibility = INVISIBILITY_ABSTRACT is set on the base class itself
# (code/game/objects/effects/landmarks.dm), so there is nothing visual any of
# them are worth preserving. Job spawn points (landmark/start/<job>) are the
# one subtree with a real SS14 counterpart (SpawnPointJob markers) and are
# mapped in entities.yml instead -- everything below is tgstation-specific
# game logic (a minigame arena, event/loot-spawning systems, nav beacons, a
# unit-test-only sanity marker) with no matching system in this fork to wire
# up, so there is genuinely nothing to convert them to, the same reasoning as
# /area above.
- /obj/effect/landmark/awaystart
- /obj/effect/landmark/thunderdome
- /obj/effect/landmark/event_spawn
- /obj/effect/landmark/generic_maintenance_landmark
- /obj/effect/landmark/navigate_destination
- /obj/effect/landmark/firealarm_sanity
- /obj/effect/landmark/blobstart
- /obj/effect/landmark/carpspawn
- /obj/effect/landmark/secequipment

# Three more turfs in the same "genuinely not a real map tile" category as
# /area above, each confirmed by source:
#   /turf/template_noop      -- a sentinel the DMM reader checks for (reader.dm)
#                                to mean "skip placing a turf here", not a turf
#                                that is ever actually placed.
#   /turf/cordon              -- the invisible, indestructible world-border turf
#                                (invisibility = INVISIBILITY_ABSTRACT,
#                                code/modules/awaymissions/cordon.dm).
#   /turf/open/ai_visible     -- background tile of the AI multicam HUD's
#                                viewing room, off-map (plane -19, SPACE_LAYER,
#                                code/modules/mob/living/silicon/ai/multicam.dm),
#                                never a placeable station floor.
- /turf/template_noop
- /turf/cordon
- /turf/open/ai_visible

# Same "invisible map-logic marker, self-deletes, nothing to convert" pattern
# as /obj/effect/mapping_helpers above, confirmed by source on each:
#   /obj/modular_map_connector and /obj/modular_map_root -- both
#     invisibility = INVISIBILITY_ABSTRACT (modular_map_loader.dm); root loads
#     a random sub-map from a .toml config at Initialize() and never renders.
#   /obj/docking_port (and every subtype, incl. /stationary) --
#     invisibility = INVISIBILITY_ABSTRACT (shuttle.dm) -- a coordinate marker
#     for tgstation's shuttle subsystem, which SS14 does not share the data
#     model of, the same reasoning as the pipe/cable networks above.
#   /obj/structure/fans/tiny/invisible -- invisibility = INVISIBILITY_ABSTRACT
#     (fans.dm), an airflow-blocker logic marker, not a real fan.
- /obj/modular_map_connector
- /obj/modular_map_root
- /obj/docking_port
- /obj/structure/fans/tiny/invisible

# More logic-only landmark subtrees (see the comment above the first batch
# of these for the general reasoning) -- each is a marker for a
# tgstation-specific system this fork doesn't implement: the away-mission
# hotel elevator, the lavaland mining event, ERT event spawning, the
# automated atmos self-test framework, the AI multicam viewing room
# (paired with the ai_visible turf already ignored above), the CTF and
# Mafia minigames, and the procedural river system (river_waypoint's own
# source sets invisibility = INVISIBILITY_ABSTRACT explicitly, same as the
# base landmark class every one of these already inherits it from).
- /obj/effect/landmark/prisonwarp
- /obj/effect/landmark/ert_spawn
- /obj/effect/landmark/atmospheric_sanity
- /obj/effect/landmark/mining_center
- /obj/effect/landmark/ai_multicam_room
- /obj/effect/landmark/ctf
- /obj/effect/landmark/mafia_game_area
- /obj/effect/landmark/river_waypoint
- /obj/effect/landmark/transport
# Another batch of minigame/antagonist-specific spawn markers, same "no
# matching system in this fork" reasoning as the batch above -- each
# verified by source: deathmatch (deathmatch_mapping.dm), mafia
# (mafia/map_pieces.dm), the whole bitrunning/* subtree
# (bitrunning/objects/landmarks.dm), basketball (basketball_map_loading.dm),
# the shuttle arena minigame (area/areas/shuttles.dm), the voidwalker and
# abductor antagonist roles (their own antagonist modules), and the
# holding-facility/ert-shuttle/nukeop-elevator/nukeop-base event markers
# (game/objects/effects/landmarks.dm) -- none of these game modes or
# antagonist roles exist in this fork.
- /obj/effect/landmark/deathmatch_player_spawn
- /obj/effect/landmark/mafia
- /obj/effect/landmark/bitrunning
- /obj/effect/landmark/basketball
- /obj/effect/landmark/shuttle_arena_entrance
- /obj/effect/landmark/shuttle_arena_safe
- /obj/effect/landmark/voidwalker_void
- /obj/effect/landmark/abductor
- /obj/effect/landmark/holding_facility
- /obj/effect/landmark/ert_shuttle_spawn
- /obj/effect/landmark/start/nukeop_elevator
- /obj/effect/landmark/start/nukeop_base

# /obj/effect/step_trigger (teleporter, thrower, message, sound_effect, ...):
# invisibility = INVISIBILITY_ABSTRACT set on the base class itself
# ("nope cant see this shit" -- code/game/objects/effects/step_triggers.dm),
# the same invisible-logic-marker pattern as the landmarks above. The
# teleporter variant's target is also literal fixed x/y/z coordinates baked
# into the source map, which wouldn't mean anything in a converted map's
# coordinate space even if it were visible.
- /obj/effect/step_trigger

# The Xenomorph antagonist subsystem (hive weeds, resin walls/membranes,
# eggs, the drone/hunter/etc. castes themselves) has no equivalent in this
# fork at all -- checked from several angles (exact id, "xeno"/"alien"/
# "hivemind"/"facehugger" keyword search across Resources/Prototypes) and
# found nothing but unrelated substring hits (xenoarchaeology artifacts,
# flavour text). Not renamed or hidden elsewhere, the whole gameplay system
# just isn't implemented, the same reasoning as newscaster/navbeacon above.
- /obj/structure/alien
- /mob/living/basic/alien
- /obj/item/clothing/mask/facehugger

# /obj/effect/light_emitter (and /thunderdome, /fake_outdoors, /podbay):
# invisibility = INVISIBILITY_ABSTRACT, no sprite of its own -- it exists
# purely to call set_light() and fake ambient lighting near lava/glowing
# terrain in mining ruins (code/modules/mining/mine_items.dm). Every light
# source this fork's prototypes define is attached to a real, visible
# fixture (a wall light, a lamp post, a crystal, ...) -- there is no
# "invisible light with no fixture" concept to place it as.
- /obj/effect/light_emitter

# /turf/open/genturf (plain, /blue, /orange): not a real tile, a debug
# placeholder. Its own source comment says so outright -- "This turf doesn't
# actually do anything beyond provide contrast for mappers and be very
# visible when stuff breaks in game. [...] If you see this, and you're not a
# ghost, yell at coders" (code/datums/mapgen/JungleGenerator.dm). The map
# generator's generate_terrain() overwrites every genturf tile with a
# procedurally chosen biome turf before a round starts -- it is never the
# tile a player actually sees, so there is no fixed sprite to convert it to.
- /turf/open/genturf
