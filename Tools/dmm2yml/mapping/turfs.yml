# ore veins: tg's own per-ore turf types (minerals.dm) overlap with SS14's
# WallRock<Ore> family for exactly gold/diamond/plasma/silver/uranium/
# bananium (tg's titanium and bscrystal, and SS14's coal/quartz/tin/salt/
# artifact_fragment, have no counterpart on the other side -- same pattern
# as the floor-tile mineral family earlier). WallRockGold and friends carry
# an EntityRemap component that swaps in the basalt/snow-biome look on their
# own, so the same bare ore id is used under every tg biome variant rather
# than guessing at a WallRockBasalt/WallRockSnow id by hand; only the base
# `tile:` changes to match the biome, same as the plain rules above.
/turf/closed/mineral/gold:
  tile: FloorAsteroidSand
  entity: WallRockGold
/turf/closed/mineral/gold/volcanic:
  tile: FloorBasalt
  entity: WallRockGold
/turf/closed/mineral/diamond:
  tile: FloorAsteroidSand
  entity: WallRockDiamond
/turf/closed/mineral/diamond/volcanic:
  tile: FloorBasalt
  entity: WallRockDiamond
/turf/closed/mineral/diamond/ice:
  tile: FloorSnow
  entity: WallRockDiamond
/turf/closed/mineral/plasma:
  tile: FloorAsteroidSand
  entity: WallRockPlasma
/turf/closed/mineral/plasma/volcanic:
  tile: FloorBasalt
  entity: WallRockPlasma
/turf/closed/mineral/plasma/ice:
  tile: FloorSnow
  entity: WallRockPlasma
/turf/closed/mineral/silver:
  tile: FloorAsteroidSand
  entity: WallRockSilver
/turf/closed/mineral/silver/volcanic:
  tile: FloorBasalt
  entity: WallRockSilver
/turf/closed/mineral/silver/ice/icemoon:
  tile: FloorSnow
  entity: WallRockSilver
/turf/closed/mineral/uranium:
  tile: FloorAsteroidSand
  entity: WallRockUranium
/turf/closed/mineral/uranium/volcanic:
  tile: FloorBasalt
  entity: WallRockUranium
/turf/closed/mineral/bananium:
  tile: FloorAsteroidSand
  entity: WallRockBananium
/turf/closed/mineral/bananium/volcanic:
  tile: FloorBasalt
  entity: WallRockBananium
# gibtonite ore vein, same tile/entity split as the other ore veins above.
/turf/closed/mineral/gibtonite:
  tile: FloorAsteroidSand
  entity: AsteroidRockGibtonite
/turf/closed/mineral/gibtonite/volcanic:
  tile: FloorBasalt
  entity: AsteroidRockGibtonite
/turf/closed/mineral/gibtonite/volcanic/red_rock:
  tile: FloorBasalt
  entity: AsteroidRockGibtonite
/turf/closed/mineral/gibtonite/volcanic/shale:
  tile: FloorBasalt
  entity: AsteroidRockGibtonite
/turf/closed/mineral/gibtonite/ice/icemoon:
  tile: FloorSnow
  entity: AsteroidRockGibtonite

# constructed material walls (built from refined sheets, not ore veins --
# tg's own /turf/closed/wall/mineral/<material> family). Matched by tg's own
# `name` string, which for most of these is a literal "<material> wall".
/turf/closed/wall/mineral/gold:
  tile: Plating
  entity: WallGold
/turf/closed/wall/mineral/silver:
  tile: Plating
  entity: WallSilver
/turf/closed/wall/mineral/diamond:
  tile: Plating
  entity: WallDiamond
# tg's own name is "bananium wall", same as the id despite SS14 calling the
# id itself WallClown.
/turf/closed/wall/mineral/bananium:
  tile: Plating
  entity: WallClown
/turf/closed/wall/mineral/sandstone:
  tile: Plating
  entity: WallSandstone
/turf/closed/wall/mineral/uranium:
  tile: Plating
  entity: WallUranium
/turf/closed/wall/mineral/plasma:
  tile: Plating
  entity: WallPlasma
/turf/closed/wall/mineral/wood:
  tile: Plating
  entity: WallWood
# tg's own comment: "has to use this path due to how building walls works" --
# titanium is tg's shuttle hull wall material.
/turf/closed/wall/mineral/titanium:
  tile: Plating
  entity: WallShuttle
# "runed metal wall" -- the Nar'Sie cult's wall, matching WallCult.
/turf/closed/wall/mineral/cult:
  tile: Plating
  entity: WallCult
# "living wall" -- matches WallMeat.
/turf/closed/wall/material/meat:
  tile: Plating
  entity: WallMeat
# tg's lavaland necropolis ruin's "tomb wall" -- matches WallNecropolis
# (sprite file necropolis.rsi, same ruin theme).
/turf/closed/wall/tomb:
  tile: Plating
  entity: WallNecropolis
# tg's own desc: "A wall covered in a thick sheet of ice."
/turf/closed/wall/ice:
  tile: Plating
  entity: WallIce
# real, distinct map-placeable rusted-wall turfs in tg (their own
# Initialize proc, not just a damage animation on the plain wall) -- match
