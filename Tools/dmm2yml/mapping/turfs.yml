# indestructible variants that turned out to reuse an existing sprite
# (Resources/Textures/Tiles/*.png) under a different name/context, found by
# matching icon_state to filename rather than guessing from the mechanic:
/turf/open/indestructible/hoteltile: FloorShowroom
/turf/open/indestructible/hotelwood: FloorWood
/turf/open/indestructible/meat: FloorFlesh
/turf/open/indestructible/rockyground: FloorCave
# same "meat" icon_state as indestructible/meat above, non-indestructible.
/turf/open/floor/meat: FloorFlesh
# same "circuits running through the floor" description/sprite as the real
# bitrunning circuit-floor look.
/turf/open/indestructible/bitrunning_transport: FloorBlueCircuit
# honk (bananium floor): a "fake tile" entity on top of a base tile, the
# same pattern as FloorLavaEntity/FloorChasmEntity above -- confirmed
# against two real maps using FloorBananiumEntity (Shuttles/ShuttleEvent/
# honki.yml, _Horizon/Dungeon/lavadunges.yml): the honki.yml one sits on
# FloorClown, but that shuttle is clown-themed everywhere, not a
# requirement of the entity; lavadunges.yml (unthemed) sits on plain
# Plating, which is the correct general default.
/turf/open/indestructible/honk:
  tile: Plating
  entity: FloorBananiumEntity
# the mineral vein version reuses the exact same icon_state ("bananium")
# as honk above -- same fix.
/turf/open/floor/mineral/bananium:
  tile: Plating
  entity: FloorBananiumEntity

