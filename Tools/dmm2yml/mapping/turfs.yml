# /turf/... -> an SS14 tile, and optionally an entity standing on it.
#
# Rules are inherited down the SS13 path tree: the rule for
# '/turf/open/floor/iron/dark' also covers '/turf/open/floor/iron/dark/corner',
# '/dark/textured', '/dark/smooth_half' and so on. SS13 encodes corner and edge
# variants as separate turfs; SS14 draws those with decals instead, so they all
# collapse onto the same tile here.
#
# Two forms:
#   /turf/...: TileId
#   /turf/...: {tile: TileId, entity: PrototypeId}
#
# There is deliberately no catch-all for '/turf/open/floor'. A floor this file
# does not name shows up in the scan report for a human to decide on, rather
# than being quietly turned into steel.

# ---- space and hull ----
/turf/open/space: Space
/turf/open/floor/plating: Plating
/turf/open/floor/plating/foam: FloorMetalFoam
/turf/open/floor/catwalk_floor: Lattice

# ---- the iron family (SS14 calls it steel) ----
/turf/open/floor/iron: FloorSteel
/turf/open/floor/iron/dark: FloorDark
/turf/open/floor/iron/white: FloorWhite
/turf/open/floor/iron/textured: FloorSteel
/turf/open/floor/iron/diagonal: FloorSteelDiagonal
/turf/open/floor/iron/cafeteria: FloorSteelCheckerLight
/turf/open/floor/iron/checker: FloorSteelCheckerDark
/turf/open/floor/iron/freezer: FloorFreezer
/turf/open/floor/iron/kitchen_coldroom: FloorFreezer
/turf/open/floor/iron/grimy: FloorSteelDirty
/turf/open/floor/iron/showroomfloor: FloorShowroom
/turf/open/floor/iron/chapel: FloorSteelMono
/turf/open/floor/iron/goonplaque: FloorSteel
/turf/open/floor/iron/recharge_floor: FloorSteel
/turf/open/floor/iron/stairs: FloorSteel        # SS14 draws stairs as decals
/turf/open/floor/iron/solarpanel: Plating       # the panels themselves are entities
/turf/open/floor/iron/dark/telecomms: FloorTechMaint

# ---- engineering ----
/turf/open/floor/engine: FloorReinforced        # also covers /air, /o2, /n2, /vacuum, ...
/turf/open/floor/glass: FloorGlass
/turf/open/floor/glass/reinforced: FloorRGlass
/turf/open/floor/eighties: FloorEighties

# ---- misc named floors ----
/turf/open/floor/plastic: FloorPlastic
/turf/open/floor/mineral/silver: FloorSilver
# rockvault.png is icon_state "rockvault" on both sides: tgstation's own
# /turf/open/floor/vault ("strange floor") and the indestructible-mechanic
# /turf/open/indestructible/vault use the exact same icon_state.
/turf/open/floor/vault: FloorRockVault
/turf/open/indestructible/vault: FloorRockVault
# Ratvar/clockwork tiles: filled and flat are exact icon_state matches
# (clockwork_floor_filled.png, reebe.png) -- the bare, unsuffixed bronze
# floor (icon_state "clockwork_floor", no "_filled") has no equivalent tile
# in this fork and is left unresolved rather than reusing the filled one.
/turf/open/floor/bronze/filled: FloorBrassFilled
/turf/open/floor/bronze/flat: FloorBrassReebe

# ---- circuitry ----
/turf/open/floor/circuit: FloorBlueCircuit
/turf/open/floor/circuit/green: FloorGreenCircuit
/turf/open/floor/circuit/red: FloorRedCircuit

# ---- wood and carpet ----
/turf/open/floor/wood: FloorWood
/turf/open/floor/wood/large: FloorWoodLarge
/turf/open/floor/wood/parquet: FloorWoodTile
/turf/open/floor/carpet: FloorCarpetOffice      # SS14 has no per-colour carpets

# ---- natural ----
/turf/open/floor/grass: FloorGrass
/turf/open/floor/fake_snow: FloorSnow
# The base asteroid floor -- basalt above is a colder-biome recolour of the
# same turf and stays a separate, more specific rule. /airless is the same
# tile with no atmosphere (code/game/turfs/open/asteroid.dm: only var changes,
# baseturfs points right back at itself), so it's covered by inheritance.
/turf/open/misc/asteroid: FloorAsteroidSand
/turf/open/misc/asteroid/basalt: FloorBasalt
# /misc/grass itself has no icon_state of its own in tgstation -- every real
# instance is the /jungle subtype (icon_state "junglegrass", also covering
# /jungle/lavaland and /jungle/station, which only change baseturfs/atmos, not
# the sprite) -- FloorGrassJungle's own sprite file is literally grassjungle.png.
# Unlike the procedural genturf/icemoon biome turfs below, this one has an
# exact, confirmed sprite match, so it stays mapped rather than excluded.
/turf/open/misc/grass: FloorGrassJungle
# Same "use THIS for station maps" split as grass above (planet.dm's own
# comment on dirt/station literally says so): bare /misc/dirt and /dirt/jungle
# keep their planetary baseturf and are left with the excluded procedural
# terrain below, but /dirt/station (icon_state "dirt", unchanged) and
# /dirt/dark/station ("greenerdirt", losing only the green tint -- this fork
# has one dirt tile) are real station floor dressing.
/turf/open/misc/dirt/station: FloorDirt
/turf/open/misc/dirt/dark/station: FloorDirt

# ---- walls: a tile plus a wall entity on top ----
/turf/closed/wall:
  tile: Plating
  entity: WallSolid
/turf/closed/wall/r_wall:
  tile: Plating
  entity: WallReinforced
/turf/closed/wall/mineral/plastitanium:
  tile: Plating
  entity: WallPlastitanium
/turf/closed/indestructible:
  tile: Plating
  entity: WallRiveted
/turf/closed/mineral/volcanic:
  tile: FloorBasalt
  entity: WallRock
# The bare, ore-less rock wall -- code/game/turfs/closed/minerals.dm sets its
# own baseturfs to /turf/open/misc/asteroid/airless, i.e. this is exactly what
# is left once it's mined out.
/turf/closed/mineral:
  tile: FloorAsteroidSand
  entity: WallRock
