# A camera is the one wall-mounted entity here that is NOT like AirAlarm/APC/
# FireAlarm: those face away from the wall they are mounted on ("wall:", the
# opposite of "dir:"), but a camera's sprite faces the SAME side as its wall,
# confirmed 48/48 clean (0 counterexamples) checking SurveillanceCameraGeneral
