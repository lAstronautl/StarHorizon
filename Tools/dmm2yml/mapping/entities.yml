# ---- random-loot spawners: matched category to category, not item to item ----
# SS13 and SS14 both roll a random pick from a themed loot table at map init and
# then delete themselves (Resources/Prototypes/Entities/Markers/Spawners/Random/*),
# so the honest conversion is "point at the equivalent table", not "pick one item
# out of it and lose the randomness". Every id below is a placeable marker entity
# (`- type: entity`, not a bare `- type: entityTable`) confirmed to exist.
#
