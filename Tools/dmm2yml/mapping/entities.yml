# A directional window is not a device mounted on a floor tile next to a wall
# (see onWall above) -- it IS the border piece, occupying the edge of its own
# tile that its dir names. tgstation's own window.dm confirms this directly
# ("dir == get_dir(loc, T)" is what the window blocks passage through), and it
# was confirmed against every /tg/ station map: where a directional windoor
# (the door version of the same border-object family, code/game/machinery/
# doors/windowdoor.dm) sits right up against a wall on one side, that wall is
# on the side OPPOSITE the name in its path -- i.e. the path names the way it
# faces, not the wall it is mounted to (102/102 samples, all main stations).
# Using wall: here, like the wall-mounted devices above, would face every
# directional window and windoor 180 degrees from where it should.
/obj/structure/window/reinforced/spawner/directional/north: {entity: WindowReinforcedDirectional, dir: 1}
/obj/structure/window/reinforced/spawner/directional/south: {entity: WindowReinforcedDirectional, dir: 2}
/obj/structure/window/reinforced/spawner/directional/east: {entity: WindowReinforcedDirectional, dir: 4}
/obj/structure/window/reinforced/spawner/directional/west: {entity: WindowReinforcedDirectional, dir: 8}

