# /obj/... and /mob/... -> SS14 entity prototypes.
#
# Rules are inherited down the SS13 path tree, so '/obj/structure/table' also
# covers '/obj/structure/table/optable' unless that has a rule of its own.
#
# Forms:
#   /obj/...: PrototypeId
#   /obj/...: [PrototypeA, PrototypeB]        several entities on one tile
#   /obj/...: {entity: Id, dir: 4}            force a facing (see below)
#   /obj/...: {tile: TileId, entity: Id}      also set the tile underneath
#
# SS13 hides the orientation of some objects in the path instead of in a dir
# var, and it means two different things there:
#   'wall: north'  the object is mounted on the wall to its north, so in SS14 it
#                  faces south, away from it. Use this for anything stuck to a
#                  wall or sitting on a tile edge -- lights, alarms, cameras,
#                  APCs, directional windows.
#   'dir: 1'       the object simply faces north. Use this for free-standing
#                  things like stools. Values are BYOND's: 1 N, 2 S, 4 E, 8 W.
# Getting these two mixed up rotates everything by 180 degrees.
#
# This file covers the paths a /tg/ station leans on most. Everything else is
# reported by 'scan' for a human to decide -- that is the point of the tool, so
# resist the urge to add a catch-all rule here.

# ---- power ----
# Cables are not here: see ignore.yml.
