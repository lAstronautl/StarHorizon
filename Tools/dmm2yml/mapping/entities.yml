# gas canisters: SS14 (via this fork) ported tgstation's own exotic gas list
# wholesale (zauker, proto-nitrate, hyper-noblium, healium, etc. are not
# generic SS14 content), so matching by which gas the canister holds is a
# real identity check, not a name-similarity guess. tg's "freon" and SS14's
# "frezon" are confirmed the same gas -- both are formed from
# plasma+CO2+BZ at high temperature and both react with BZ to form Healium
# (code/modules/atmospherics/gasmixtures/reactions.dm); "frezon" is just the
# trademark-safe respelling. tg's "nob" is GAS_HYPER_NOBLIUM per
