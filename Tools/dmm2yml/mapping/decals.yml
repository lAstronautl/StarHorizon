# /obj/effect/turf_decal/... -> SS14 decals.
#
# Rules are inherited down the SS13 path tree, so a rule for
# '/obj/effect/turf_decal/siding' also covers '/siding/thinplating_new'.
# Forms: a bare id, {id, color}, {dirs: {1,2,4,8}} for direction-dependent
# decals, or {decals: [...]} to put several decals on one tile.
#
# Directions are BYOND's: 1 north, 2 south, 4 east, 8 west.
#
# NOTE: SS13 stores a decal's orientation in 'dir' while SS14 bakes it into
# the decal id.
#
# Straight lines and end caps: checked pixel-for-pixel against both sides'
# sprites (tgstation's icons/turf/decals.dmi "warningline"/"warn_end" states,
# and this repo's Resources/Textures/Decals/markings.rsi) -- both name a
# direction by which literal tile edge it touches (N = top, E = right, ...),
# so the plain N->N, E->E, S->S, W->W mapping used below is correct as is.
#
# Corners are a different story: every corner-family decal on both sides
# (WarnCorner*, MiniTileCornerOverlay*, BrickCornerOverlay*,
# WoodTrimThinCorner*) turned out to hang its accent off ONE tile corner
# rather than following the line's own direction, and BYOND's dir names
# that accent's *diagonal opposite*, not the corner itself: dir N (top) sits
# in the NW quadrant, S (bottom) in SE, E (right) in NE, W (left) in SW.
# Confirmed by measuring pixel-quadrant density on every corner sprite in
# both decals.dmi and this repo's decal RSIs -- not by eye. Every corner rule
# below already uses dir 1->NW, 2->SE, 4->NE, 8->SW; if a new corner-style
# decal is added later, re-derive it the same way rather than copying the
# line/end N->N pattern -- that pattern does not hold for corners.

# ---- hazard stripes ----
/obj/effect/turf_decal/stripes/line:
  dirs:
    1: WarnLineN
    2: WarnLineS
    4: WarnLineE
    8: WarnLineW
/obj/effect/turf_decal/stripes/end:
  dirs:
    1: WarnEndN
    2: WarnEndS
    4: WarnEndE
    8: WarnEndW
/obj/effect/turf_decal/stripes/corner:
  dirs:
    1: WarnCornerNW
    2: WarnCornerSE
    4: WarnCornerNE
    8: WarnCornerSW
/obj/effect/turf_decal/stripes/box: WarnBox
/obj/effect/turf_decal/stripes/white/line:
  dirs:
    1: WarnLineGreyscaleN
    2: WarnLineGreyscaleS
    4: WarnLineGreyscaleE
    8: WarnLineGreyscaleW
  color: '#FFFFFFFF'
/obj/effect/turf_decal/stripes/white/corner:
  dirs:
    1: WarnCornerGreyscaleNW
    2: WarnCornerGreyscaleSE
    4: WarnCornerGreyscaleNE
    8: WarnCornerGreyscaleSW
  color: '#FFFFFFFF'
/obj/effect/turf_decal/stripes/white/box:
  id: WarnBoxGreyscale
  color: '#FFFFFFFF'
/obj/effect/turf_decal/stripes/white/full:
  id: WarnFullGreyscale
  color: '#FFFFFFFF'
/obj/effect/turf_decal/stripes/red/line:
  dirs:
    1: WarnLineGreyscaleN
    2: WarnLineGreyscaleS
    4: WarnLineGreyscaleE
    8: WarnLineGreyscaleW
  color: '#DE3A3A96'
/obj/effect/turf_decal/stripes/red/corner:
  dirs:
    1: WarnCornerGreyscaleNW
    2: WarnCornerGreyscaleSE
    4: WarnCornerGreyscaleNE
    8: WarnCornerGreyscaleSW
  color: '#DE3A3A96'
/obj/effect/turf_decal/stripes/red/box:
  id: WarnBoxGreyscale
  color: '#DE3A3A96'
/obj/effect/turf_decal/stripes/red/full:
  id: WarnFullGreyscale
  color: '#DE3A3A96'
/obj/effect/turf_decal/stripes/white/end:
  dirs:
    1: WarnEndGreyscaleN
    2: WarnEndGreyscaleS
    4: WarnEndGreyscaleE
    8: WarnEndGreyscaleW
  color: '#FFFFFFFF'
/obj/effect/turf_decal/stripes/red/end:
  dirs:
    1: WarnEndGreyscaleN
    2: WarnEndGreyscaleS
    4: WarnEndGreyscaleE
    8: WarnEndGreyscaleW
  color: '#DE3A3A96'
/obj/effect/turf_decal/stripes/full: WarnFull
# /obj/effect/turf_decal itself (decal.dm) defaults to icon_state "warningline"
# -- the same state /stripes/line sets explicitly -- so the bare path with no
# subtype at all renders identically to /stripes/line.
/obj/effect/turf_decal/stripes:
  dirs:
    1: WarnLineN
    2: WarnLineS
    4: WarnLineE
    8: WarnLineW
# Asteroid stripes are a visually distinct sprite in tgstation (icon_state
# "ast_warn*", a rougher hand-painted look) but this fork has no matching
# asteroid-specific decal, so they fall back to the same ids as the regular
# hazard stripes -- same "hazard boundary" meaning, different texture lost.
/obj/effect/turf_decal/stripes/asteroid/line:
  dirs:
    1: WarnLineN
    2: WarnLineS
    4: WarnLineE
    8: WarnLineW
/obj/effect/turf_decal/stripes/asteroid/end:
  dirs:
    1: WarnEndN
    2: WarnEndS
    4: WarnEndE
    8: WarnEndW
/obj/effect/turf_decal/stripes/asteroid/corner:
  dirs:
    1: WarnCornerNW
    2: WarnCornerSE
    4: WarnCornerNE
    8: WarnCornerSW
/obj/effect/turf_decal/stripes/asteroid/box: WarnBox
/obj/effect/turf_decal/stripes/asteroid/full: WarnFull

