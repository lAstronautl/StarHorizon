# ---- hazard stripes ----
# dirs below are deliberately NOT 1:N/2:S/8:W -- Decals/markings.yml's own
# WarnLineN/S/W ids point at each other's sprite states (a bug in that file,
# not here; WarnLineE is the only one wired correctly). This swaps in
# whichever id actually renders the wanted edge until that's fixed upstream.
/obj/effect/turf_decal:
  dirs:
    1: WarnLineW
    2: WarnLineN
    4: WarnLineE
    8: WarnLineS
    5: WarnCornerNE
    6: WarnCornerSE
    9: WarnCornerNW
    10: WarnCornerSW
/obj/effect/turf_decal/stripes/line:
  dirs:
    1: WarnLineW
    2: WarnLineN
    4: WarnLineE
    8: WarnLineS
    5: WarnCornerNE
    6: WarnCornerSE
    9: WarnCornerNW
    10: WarnCornerSW
/obj/effect/turf_decal/stripes/end:
  dirs:
    1: WarnEndN
    2: WarnEndS
    4: WarnEndE
    8: WarnEndW
/obj/effect/turf_decal/stripes/corner:
  dirs:
    1: WarnCornerNW
    2: WarnCornerSE
    4: WarnCornerNE
    8: WarnCornerSW
/obj/effect/turf_decal/stripes/box: WarnBox
/obj/effect/turf_decal/stripes/white/line:
  dirs:
    1: WarnLineGreyscaleN
    2: WarnLineGreyscaleS
    4: WarnLineGreyscaleE
    8: WarnLineGreyscaleW
    5: WarnCornerGreyscaleNE
    6: WarnCornerGreyscaleSE
    9: WarnCornerGreyscaleNW
    10: WarnCornerGreyscaleSW
