# tgstation has ~20 distinct filth decals (dust, ash, vomit, food smudges,
# glass, rubble, confetti, ...); this fork's decal set only has one, so only
# the one with a real match is mapped. /dirt/dust inherits this by path-tree
# lookup, being a subpath of /dirt.
/obj/effect/decal/cleanable/dirt: Dirt
