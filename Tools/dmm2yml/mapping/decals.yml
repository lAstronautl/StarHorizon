# The bare /trimline/<colour> path (no /line, /corner, ... suffix) is the
# base class itself, icon_state "trimline_box" (tilecoloring.dm) -- a filled
# box, not a line. BrickBoxOverlay is the one box-shaped id in that family.
# arrow_cw/arrow_ccw/mid_joiner/shrink_cw/shrink_ccw and the /tram colour
# have no matching id in this fork at all and are not mapped here or
# anywhere else in this file -- left for the CSV.
/obj/effect/turf_decal/trimline/blue: {id: BrickBoxOverlay, color: '#52B4E996'}
