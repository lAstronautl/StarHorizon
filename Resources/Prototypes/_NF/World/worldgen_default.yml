- type: worldgenConfig
  id: NFDefault
  components:
    - type: WorldController
    - type: BiomeSelection
      biomes:
# Horizon start
#        - NFAsteroidsNear
#        - NFAsteroidsMid
#        - NFAsteroidsFar
        - HRZNYellowZone
        - HRZNRedZone
        - HRZNWhite
        - HRZNVoid
# Horizon end
# Horizon start: ported sector celestial bodies and background planets
    - type: SectorCelestialPlacerController
      spawnDistance: 8000
    - type: SectorBackgroundPlanetPlacerController
      minCount: 2
      maxCount: 4
      minDistance: 6000
      maxDistance: 12000
      planetPrototype: SectorBackgroundPlanet
# Horizon end
# Horizon start: expedition planets (one per biome) scattered around the sector
    - type: ExpeditionPlanetPlacerController
      biomes: [ Caves, Grasslands, Snow, Lava, Shadow, ArdoniumWastes ]
      countPerBiome: 1
      minDistance: 1500
      maxDistance: 6500
      minSeparation: 1200
# Horizon end
