# Сгенерировано SS14 UI Editor (предмет «счётчик посетителей»). Не редактируйте вручную: файл перезаписывается при сохранении.
- type: entity
  parent: BaseItem
  id: HorizonVisitorCounter
  name: "счётчик посетителей"
  description: "Отметьтесь, что были здесь. Счёт общий для всех."
  components:
  - type: Sprite
    sprite: Objects/Devices/signaller.rsi
    state: icon
  - type: Item
    sprite: Objects/Devices/signaller.rsi
  - type: ActivatableUI
    key: enum.HorizonVisitorCounterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HorizonVisitorCounterUiKey.Key:
        type: HorizonVisitorCounterBoundUserInterface
  - type: HorizonVisitorCounterItem
