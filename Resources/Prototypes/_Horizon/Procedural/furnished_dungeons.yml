# Atlas-free dungeon: rooms come from BspRoomDunGen (BSP partition: rooms fill their cells, neighbours share one wall tile and
# are joined by doors straight through it, so there are no corridors and no wasted space), doors/walls from the usual layers,
# and everything inside the rooms from RoomFurnishDunGen (roles + furniture groups).
- type: dungeonConfig
  id: HorizonFurnishedBsp
  layers:
  - !type:BspRoomDunGen
    size: 40,40
    minRoom: 7,7
    maxRoom: 14,12
    splitChance: 0.2
    loopChance: 0.25
    tile: FloorSteel

  - !type:DungeonEntranceDunGen
    count: 2
    tile: FloorSteel
    contents: NFBaseAirlock

  - !type:RoomEntranceDunGen
    tile: FloorSteel
    contents: NFBaseAirlock

  - !type:EntranceFlankDunGen
    tile: FloorSteel
    contents: NFBaseWindow

  - !type:ExternalWindowDunGen
    tile: FloorSteel
    contents: NFBaseWindow

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: FloorSteel

  # Roles + furniture groups (after walls and doors exist).
  - !type:PrototypeDunGen
    proto: HorizonRoomFurnish
    inheritDungeons: Last

  - !type:AutoCablingDunGen
    entity: CableApcExtension

- type: salvageDungeonMod
  id: HorizonFurnishedBsp
  desc: salvage-dungeon-mod-horizon-furnished-bsp
  proto: HorizonFurnishedBsp
  biomes:
    - Grasslands
