# Abandoned space station: rooms come from BspRoomDunGen (BSP partition; rooms fill their cells, 3-wide corridors run along
# every split like a station's hallways and each room opens onto one), bulkhead airlocks across the corridors, doors/walls from the
# usual layers, and everything inside the rooms from RoomFurnishDunGen (roles + furniture groups).
- type: dungeonConfig
  id: HorizonFurnishedBsp
  layers:
  - !type:BspRoomDunGen
    size: 56,56
    minRoom: 7,7
    maxRoom: 14,12
    splitChance: 0.2
    corridorWidth: 3
    tile: FloorSteel

  - !type:DungeonEntranceDunGen
    count: 2
    tile: FloorSteel
    contents: NFBaseAirlock

  - !type:RoomEntranceDunGen
    tile: FloorSteel
    contents: NFBaseAirlock

  - !type:EntranceFlankDunGen
    tile: FloorSteel
    contents: NFBaseWindow

  - !type:ExternalWindowDunGen
    tile: FloorSteel
    contents: NFBaseWindow

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: FloorSteel

  # Bulkhead airlocks across the hallways.
  - !type:JunctionDunGen
    width: 1
    tile: FloorSteel
    contents: NFBaseAirlock

  - !type:JunctionDunGen
    width: 3
    tile: FloorSteel
    contents: NFBaseAirlock

  # Roles + furniture groups (after walls and doors exist).
  - !type:PrototypeDunGen
    proto: HorizonRoomFurnish
    inheritDungeons: Last

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  # Abandoned hallways: debris in the corners and worn floor trim.
  - !type:CornerClutterDunGen
    contents: NFBaseClutter

  - !type:CorridorDecalSkirtingDunGen
    cardinalDecals:
      South: BrickTileWhiteLineS
      East: BrickTileWhiteLineE
      North: BrickTileWhiteLineN
      West: BrickTileWhiteLineW
    cornerDecals:
      SouthEast: BrickTileWhiteCornerSe
      SouthWest: BrickTileWhiteCornerSw
      NorthEast: BrickTileWhiteCornerNe
      NorthWest: BrickTileWhiteCornerNw
    pocketDecals:
      SouthWest: BrickTileWhiteInnerSw
      SouthEast: BrickTileWhiteInnerSe
      NorthWest: BrickTileWhiteInnerNw
      NorthEast: BrickTileWhiteInnerNe
    color: "#8E9AA8AA"

- type: salvageDungeonMod
  id: HorizonFurnishedBsp
  desc: salvage-dungeon-mod-horizon-furnished-bsp
  proto: HorizonFurnishedBsp
  biomes:
    - Grasslands
