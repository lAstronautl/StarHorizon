# Pools of the game's own "Dungeon" loot spawners (SpawnDungeon*), grouped by room function so a room only gets what fits it
# (mapping guide: hydroponics holds botany items, not kitchen ones). Each placement rolls one random spawner.
# Excluded on purpose: NPC loot (SpawnDungeonLootNpc*), vehicles, R&D disks, explosives T1-T5, gun/melee tier spawners
# (weapons come only from the faction armory racks).
