# Storytelling layer for RoomFurnishDunGen ("what happened in this room"), notes, and faction armory tables.
# Notes follow the mapping guide: tech and abandoned rooms tell a story through paper clues.

# ---------------------------------------------------------------- Notes
- type: entity
  id: HorizonNoteEvacuation
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Всем сотрудникам: эвакуация по сигналу тревоги. Личные вещи и документы не брать,
      уходить немедленно. Опечатайте помещение, если успеете.

- type: entity
  id: HorizonNoteAbandoned
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Объект законсервирован. Питание частично отключено, регулярный обход отменён.
      Если читаете это - значит, никто не вернулся. Не включайте то, что выключено.

- type: entity
  id: HorizonNoteRansacked
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Здесь уже побывали до нас. Всё, что унесли, унесли быстро и не закрывая дверей.
      Осторожнее: те, кто это сделал, могли остаться на объекте.

- type: entity
  id: HorizonNoteArmory
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Выдача оружия приостановлена до особого распоряжения. Ключи сдать дежурному.
      Расхождение в описи: не хватает нескольких стволов, проверьте список на стеллажах.

- type: entity
  id: HorizonNoteMedical
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Пациентов перевели. Койки не стерилизованы, аптечки пополнить некому.
      Кто дежурил следующим - просьба не оставлять препараты без присмотра.

- type: entity
  id: HorizonNoteEngineering
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Питание нестабильно: пока не заменим силовой кабель, держите резервные элементы
      при себе. Инструменты не выносить из мастерской. Это касается и тех, кто думает, что я не вижу.

- type: entity
  id: HorizonNoteLaboratory
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Образцы вывезены. Оборудование оставлено по описи, расходники списаны.
      Протокол испытаний сдать в архив до конца смены. Колбы пустые не оставлять.

- type: entity
  id: HorizonNoteBarracks
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Отбой в одиннадцать, подъём по сигналу. Шкафчики держать закрытыми.
      Кто опять оставил еду на койке - наряд вне очереди.

- type: entity
  id: HorizonNoteStorage
  parent: Paper
  name: заметка
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: |
      Опись склада не сходится: часть ящиков вскрыта, часть пропала. Новые поставки
      принимать только по накладным. Ничего не складывать у дверей.

