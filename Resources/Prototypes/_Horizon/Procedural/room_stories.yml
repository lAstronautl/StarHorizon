    - id: WeaponSniperMosin

- type: entity
  parent: MarkerBasePlaceFree
  id: HorizonSpawnArmoryNanoTrasen
  name: random NanoTrasen weapon
  suffix: Horizon
  components:
  - type: Sprite
    layers:
    - state: green
      scale: 0.7, 0.7
    - sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
      state: icon
  - type: EntityTableSpawner
    offset: 0.1
    deleteSpawnerAfterSpawn: false
    table: !type:NestedSelector
      tableId: HorizonArmoryNanoTrasen

- type: entity
  parent: MarkerBasePlaceFree
  id: HorizonSpawnArmorySyndicate
