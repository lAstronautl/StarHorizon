# Meaningful room furnishing (RoomFurnishDunGen).
#
# Group frame: x runs along the wall (to the right when looking into the room), y runs away from the wall.
# Anchor tile is 0,0. Spawners (SpawnDungeonLoot*, SalvageSpawner*, ...) are the same ones the old atlas rooms used,
# so loot tables stay shared with the rest of the game. `onWall: true` mounts on the wall tile around the room.
# Entries may use `perTiles` so bigger rooms get proportionally more content.
#
# Usage: add this layer AFTER walls and doors exist in any dungeonConfig:
#   - !type:PrototypeDunGen
#     proto: HorizonRoomFurnish
#     inheritDungeons: Last

# ---------------------------------------------------------------- Groups

