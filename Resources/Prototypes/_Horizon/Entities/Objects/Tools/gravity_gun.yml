# Shipbreaking gravity gun. Standalone: does not use the tether/force gun components.
# Use in hand to switch mode (pull / push / fire). Light loose targets are moved; heavy ones (grids,
# anchored structures) stay put and move the user instead - fire at a heavy hull and you get thrown back hard.
# Sprite is a placeholder (tether gun).
- type: entity
  id: WeaponGravityGun
  parent: BaseItem
  name: gravity gun
  description: Manipulates gravity to pull, push or launch scrap. Use it on something too heavy and you will be the one who moves.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/tether_gun.rsi
    layers:
    - state: base
  - type: UseDelay
    delay: 1.0
  - type: GravityGun
