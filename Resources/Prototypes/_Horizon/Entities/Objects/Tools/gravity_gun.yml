# Shipbreaking gravity gun: the tether gun, strong enough for scrap and able to drag a whole grid (click its floor).
- type: entity
  id: WeaponGravityGun
  parent: WeaponTetherGun
  name: gravity gun
  description: Manipulates gravity to move scrap and hulls.
  components:
  - type: TetherGun
    massLimit: 5000
    maxForce: 3000
  - type: Sprite
    sprite: _Horizon/Objects/Tools/gravity_gun.rsi
    layers:
    - state: icon
    - state: grav_pull
      map: [ "unshaded" ]
      shader: unshaded
      visible: false
  - type: ToggleableVisuals
    spriteLayer: unshaded
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
