# Shipbreaking cutter. A welder: it has to be lit and every cut burns fuel (refuel it at a welding tank).
# Click a wall to cut it loose (then move it with a gravity gun), click the seam between two floor tiles to cut
# a slit along it: the slit leaks air, shows as a gap, and a part with no connections left breaks off into its own grid.
# A ghost of the cut is shown under the cursor while it is held. Sprite is a placeholder (welder).
- type: entity
  id: ShipCutter
  parent: Welder
  name: ship cutter
  description: A heavy plasma cutter for taking ships apart. Light it, then cut a wall loose or click the seam between two floor tiles to cut along it.
  components:
  - type: ShipCutter
    wallWhitelist:
      tags:
      - Wall
