# Industrial smelter — pulls in grids (shuttles) and recycles their tiles into materials.
# Ported from space-wizards/space-station-14#43651. Sprite is a placeholder (recycler).
- type: entity
  id: IndustrialSmelter
  parent: BaseMachinePowered
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: DeviceLinkSink
    ports:
      - Reverse
      - Forward
      - Off
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Doors
    sprite: Structures/Machines/recycling.rsi
    layers:
    - state: grinder-o0
  - type: Conveyor
  - type: Rotatable
  - type: MaterialStorage
    insertOnInteract: false
  - type: TileReclaimer
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ApcPowerReceiver
    powerLoad: 500

# No grid whitelist: eats any grid pushed into it, including stations. Admin only.
- type: entity
  id: IndustrialSmelterAdmeme
  parent: IndustrialSmelter
  suffix: Admeme
  categories: [ ]
