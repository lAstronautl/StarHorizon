# Industrial smelter — pulls in grids (shuttles) and recycles their tiles into materials.
# Ported from space-wizards/space-station-14#43651. Sprite is a placeholder (recycler).
- type: entity
  id: IndustrialSmelter
  parent: BaseMachinePowered
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: DeviceLinkSink
    ports:
      - Reverse
      - Forward
      - Off
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Doors
    sprite: Structures/Machines/recycling.rsi
    layers:
    - state: grinder-o0
  - type: Conveyor
  - type: Rotatable
  - type: MaterialStorage
    insertOnInteract: false
  - type: TileReclaimer
    efficiency: 5 # tiles are paid for in money, see ServerTileReclaimerSystem
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ApcPowerReceiver
    powerLoad: 500

# No grid whitelist: eats any grid pushed into it, including stations. Admin only.
- type: entity
  id: IndustrialSmelterAdmeme
  parent: IndustrialSmelter
  suffix: Admeme
  categories: [ ]

# Shipbreaking scrap processors: buy loose entities (fed in by conveyors) and pay the station bank account.
# Sprites are placeholders (recycler).
- type: entity
  id: BaseScrapProcessor
  parent: BaseMachinePowered
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      brrt:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        layer:
        - FullTileLayer
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: DeviceLinkSink
    ports:
      - Reverse
      - Forward
      - Off
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Doors
    sprite: Structures/Machines/recycling.rsi
    layers:
    - state: grinder-o0
  - type: Conveyor
  - type: Rotatable
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

# Processor: walls.
- type: entity
  id: ShipbreakingProcessor
  parent: BaseScrapProcessor
  components:
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      tags:
      - Wall

# Barge: furniture (chairs, beds, lockers, tables).
- type: entity
  id: ShipbreakingBarge
  parent: BaseScrapProcessor
  components:
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      components:
      - Strap
      - EntityStorage
      - Climbable
    blacklist:
      components:
      - MobState
