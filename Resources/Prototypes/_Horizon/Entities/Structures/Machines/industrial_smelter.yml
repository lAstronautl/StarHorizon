# Shipbreaking machines. All pay the station bank account. Sprites are placeholders (recycler).
# Ported TileReclaimer from space-wizards/space-station-14#43651.

# Furnace: burns loose floor tile items and pipes.
- type: entity
  id: ShipbreakingFurnace
  parent: BaseScrapProcessor
  components:
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      components:
      - FloorTile
      - AtmosPipeLayers

# Processor: eats whole grids (shuttle tiles) pulled into it and buys loose walls and cable coils.
- type: entity
  id: ShipbreakingProcessor
  parent: BaseScrapProcessor
  components:
  - type: TileReclaimer
    efficiency: 5 # tiles are paid for in money, see ServerTileReclaimerSystem
    whitelist:
      components:
      - Shuttle
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      tags:
      - Wall
      - CableCoil

# No grid whitelist: eats any grid pushed into it, including stations. Admin only.
- type: entity
  id: ShipbreakingProcessorAdmeme
  parent: BaseScrapProcessor
  suffix: Admeme
  components:
  - type: TileReclaimer
    efficiency: 5
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3

# Shipbreaking scrap processors: buy loose entities (fed in by conveyors) and pay the station bank account.
# Sprites are placeholders (recycler).
- type: entity
  id: BaseScrapProcessor
  parent: BaseMachinePowered
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      brrt:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        layer:
        - FullTileLayer
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: DeviceLinkSink
    ports:
      - Reverse
      - Forward
      - Off
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    drawdepth: Doors
    sprite: Structures/Machines/recycling.rsi
    layers:
    - state: grinder-o0
  - type: Conveyor
  - type: Rotatable
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

# Barge: furniture (chairs, beds, lockers, tables).
- type: entity
  id: ShipbreakingBarge
  parent: BaseScrapProcessor
  components:
  - type: ScrapProcessor
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    whitelist:
      components:
      - Strap
      - EntityStorage
      - Climbable
    blacklist:
      components:
      - MobState
