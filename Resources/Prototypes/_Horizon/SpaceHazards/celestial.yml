- type: entity
  id: SectorCelestialStar
  name: star
  description: A distant sun.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: SectorCelestialBody
    kind: Star
    spriteRadius: 32
    pixels: 1024
  - type: PointLight
    enabled: true
    color: "#77D6C1"
    radius: 480
    energy: 9
    softness: 1.2
    castShadows: false

- type: entity
  id: SectorCelestialBlackHole
  name: black hole
  description: A gravitational anomaly bending the light around it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: SectorCelestialBody
    kind: BlackHole
    spriteRadius: 29
    pixels: 1024
  - type: PointLight
    enabled: true
    color: "#F5F540"
    radius: 336
    energy: 5
    softness: 1.2
    castShadows: false
  - type: SingularityDistortion
    intensity: 18000
    falloffPower: 1.55
    maxDistance: 96

- type: entity
  id: SectorBackgroundPlanet
  name: distant planet
  description: A far-off world visible across the sector. Decorative.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: SectorBackgroundPlanet
    spriteRadius: 9
    pixels: 1024
  - type: PointLight
    enabled: true
    color: "#FFFFFF"
    radius: 150
    energy: 2.4
    softness: 1.4
    castShadows: false
