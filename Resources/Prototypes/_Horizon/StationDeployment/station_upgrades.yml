# Station upgrade equipment - purchasable via the station control console once a development
# category reaches the required level. Delivered flatpacked to the docked cargo capsule
# ("tradedrop"); the crew has to carry it to the station and unpack it with a tool there. The
# unpacked machine stays inert until activated with the station owner's ID card
# (StationUpgradeEquipmentSystem), which also anchors it in place.
#
# These are the vanilla/NF bank ATM computers, just wrapped with StationUpgradeEquipment so
# they have to be installed and activated by the station owner like any other purchase.

- type: entity
  parent: ComputerWithdrawBankATM
  id: StationUpgradeWithdrawAtm
  suffix: Station Upgrade
  components:
  - type: StationUpgradeEquipment

- type: entity
  parent: ComputerBlackMarketBankATM
  id: StationUpgradeBlackMarketAtm
  suffix: Station Upgrade
  components:
  - type: StationUpgradeEquipment

- type: entity
  parent: ComputerBankATM
  id: StationUpgradeFullAtm
  suffix: Station Upgrade
  components:
  - type: StationUpgradeEquipment

- type: entity
  parent: BaseNFFlatpack
  id: StationUpgradeWithdrawAtmFlatpack
  name: station bank terminal flatpack (withdraw-only)
  description: A flatpack used for installing a withdraw-only bank terminal on a deployed station.
  components:
  - type: Flatpack
    entity: StationUpgradeWithdrawAtm

- type: entity
  parent: BaseNFFlatpack
  id: StationUpgradeBlackMarketAtmFlatpack
  name: station black market terminal flatpack
  description: A flatpack used for installing a black market bank terminal on a deployed station.
  components:
  - type: Flatpack
    entity: StationUpgradeBlackMarketAtm

- type: entity
  parent: BaseNFFlatpack
  id: StationUpgradeFullAtmFlatpack
  name: station bank terminal flatpack
  description: A flatpack used for installing a full-service bank terminal on a deployed station.
  components:
  - type: Flatpack
    entity: StationUpgradeFullAtm

- type: stationUpgradePurchase
  id: StationUpgradeWithdrawAtmPurchase
  name: station-upgrade-withdraw-atm-name
  description: station-upgrade-withdraw-atm-description
  category: NFService
  requiredLevel: 3
  price: 5000
  entity: StationUpgradeWithdrawAtmFlatpack

- type: stationUpgradePurchase
  id: StationUpgradeBlackMarketAtmPurchase
  name: station-upgrade-blackmarket-atm-name
  description: station-upgrade-blackmarket-atm-description
  category: NFService
  requiredLevel: 5
  price: 8000
  entity: StationUpgradeBlackMarketAtmFlatpack

- type: stationUpgradePurchase
  id: StationUpgradeFullAtmPurchase
  name: station-upgrade-full-atm-name
  description: station-upgrade-full-atm-description
  category: NFService
  requiredLevel: 10
  price: 15000
  entity: StationUpgradeFullAtmFlatpack
