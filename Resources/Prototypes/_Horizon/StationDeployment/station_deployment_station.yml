- type: entity
  id: DeployedStationBase
  parent: BaseStation
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: StationOrderDatabase
  - type: StationDevelopment
  - type: ExtraShuttleInformation

- type: gameMap
  id: DeployedStation
  mapName: 'Развёрнутая станция'
  mapPath: /Maps/_Horizon/CustomStation/station.yml
  minPlayers: 0
  stations:
    DeployedStation:
      stationProto: DeployedStationBase
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Развёрнутая станция {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          Contractor: [ 0, 0 ]
          MercenaryStation: [ 0, 0 ]
