- type: entity
  parent: BaseElectronics
  abstract: true
  noSpawn: true
  id: BasePciDevice
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: blank_mod
    - type: Tag
      tags: [Pci]
    - type: SerialNumber

- type: entity
  parent: BasePciDevice
  id: TtsPciDevice
  components:
    - type: TtsDevice
    - type: Speech
      speechSounds: Vending

- type: entity
  parent: BasePciDevice
  id: SerialTerminalDevice
  components:
    - type: SerialTerminalDevice
    - type: ActivatableUI
      key: enum.SerialTerminalUiKey.Key
    - type: UserInterface
      interfaces:
        enum.SerialTerminalUiKey.Key:
          type: SerialTerminalBoundUserInterface

- type: entity
  parent: BasePciDevice
  id: GpuDevice
  components:
    - type: StaticPrice
      price: 8000
    - type: GpuDevice

- type: entity
  parent: BasePciDevice
  id: HealthAnalyzerDevice
  components:
    - type: HealthAnalyzerDevice
      scanningEndSound:
        path: "/Audio/Items/Medical/healthscanner.ogg"

- type: entity
  parent: HealthAnalyzerDevice
  id: HealthAnalyzerDeviceGigacancer
  suffix: Gigacancer
  components:
    - type: HealthAnalyzerDevice
      scanningEndSound:
        path: "/Audio/Items/Medical/healthscanner.ogg"
      disease: Ultragigacancer

- type: entity
  parent: HealthAnalyzerDevice
  id: HealthAnalyzerDeviceZombie
  suffix: Gigacancer
  components:
    - type: HealthAnalyzerDevice
      scanningEndSound:
        path: "/Audio/Items/Medical/healthscanner.ogg"
      disease: ActiveZombieVirus

- type: entity
  parent: HealthAnalyzerDevice
  id: HealthAnalyzerDeviceHonk
  suffix: Gigacancer
  components:
    - type: HealthAnalyzerDevice
      scanningEndSound:
        path: "/Audio/Items/Medical/healthscanner.ogg"
      disease: ActiveHonkVirus

