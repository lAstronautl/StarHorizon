# continental biome mostly for testing cool stuff tbh

- type: biomeTemplate
  id: MonoContinentalDesertOcean
  layers:
  - !type:BiomeMetaLayer
    template: MonoDesert # StarHorizon: у Monolith MonoDesertPermanentPlanet (постоянная планета), не переносилась
    threshold: -0.5
    noise:
      frequency: 0.001
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2
  - !type:BiomeMetaLayer
    template: MonoDesert
    threshold: 0
    noise:
      frequency: 0.001
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2
  - !type:BiomeMetaLayer
    template: MonoOcean
    threshold: 0.25
    noise:
      frequency: 0.01
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2
