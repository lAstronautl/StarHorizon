# Дроп-под. Спрайты: свои (Xigovir), четыре вида: экспедиционный (по умолчанию), NanoTrasen, Синдикат, AnRox.
# Видимость слоёв (стоит / в полёте скрыт / после падения, дверь, воронка) задаёт DropPodVisualizerSystem.
- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: BaseStarHorizonDropPod
  name: drop pod
  description: A bluespace drop pod. Load it with cargo or climb in yourself, link it to a drop pod console with a multitool (device linking) and launch.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Icon
    sprite: _StarHorizon/Structures/DropPod/expedition.rsi
    state: icon
  - type: Sprite
    noRot: true
    sprite: _StarHorizon/Structures/DropPod/expedition.rsi
    layers:
    # Воронка под упавшей капсулой.
    - state: ground
      map: ["droppodGround"]
      visible: false
    # Капсула стоит: корпус и дверца.
    - state: base-open
      map: ["droppodBase"]
    - state: door-close
      map: ["droppodDoor"]
    # Капсула после падения (стоит в воронке): корпус и дверца, открывается после посадки.
    - state: base-fall-open
      map: ["droppodLanded"]
      visible: false
    - state: fall-door-close
      map: ["droppodLandedDoor"]
      visible: false
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  # Фикстура и хранилище - как у CrateGeneric / CrateGenericSteel.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 50
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: EntityStorage
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: PointLight
    enabled: false
    radius: 3.5
    energy: 3
    color: "#4aa8ff"
  # Запуск штатной системой сигналов: консоль (DeviceLinkSource) шлёт сигнал на порт Trigger.
  # TriggerOnActivate не нужен (запуск только по сигналу) и мешал: перехватывал клик, и дверь не открывалась.
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: DropPod
    landingDamage:
      types:
        Blunt: 25

# Экспедиционная капсула (вид по умолчанию).
- type: entity
  parent: BaseStarHorizonDropPod
  id: StarHorizonDropPod

- type: entity
  parent: BaseStarHorizonDropPod
  id: StarHorizonDropPodNanotrasen
  suffix: NanoTrasen
  components:
  - type: Icon
    sprite: _StarHorizon/Structures/DropPod/nanotrasen.rsi
  - type: Sprite
    sprite: _StarHorizon/Structures/DropPod/nanotrasen.rsi
  - type: DropPod
    landingAnimationEffect: StarHorizonDropPodLandingAnimationNanotrasen

- type: entity
  parent: BaseStarHorizonDropPod
  id: StarHorizonDropPodSyndicate
  suffix: Syndicate
  components:
  - type: Icon
    sprite: _StarHorizon/Structures/DropPod/syndicate.rsi
  - type: Sprite
    sprite: _StarHorizon/Structures/DropPod/syndicate.rsi
  - type: DropPod
    landingAnimationEffect: StarHorizonDropPodLandingAnimationSyndicate

- type: entity
  parent: BaseStarHorizonDropPod
  id: StarHorizonDropPodAnrox
  suffix: AnRox
  components:
  - type: Icon
    sprite: _StarHorizon/Structures/DropPod/anrox.rsi
  - type: Sprite
    sprite: _StarHorizon/Structures/DropPod/anrox.rsi
  - type: DropPod
    landingAnimationEffect: StarHorizonDropPodLandingAnimationAnrox

- type: entity
  id: StarHorizonDropPodMarker
  name: drop pod landing zone
  description: Something is about to fall from the sky here.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _StarHorizon/Effects/DropPod/marker.rsi
    noRot: true
    layers:
    - state: marker
      shader: unshaded
    - state: marker_ping
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 1.5
    color: "#ff3030"
  - type: Tag
    tags:
    - HideContextMenu

- type: sourcePort
  id: DropPodLaunch
  name: signal-port-name-droppod-launch
  description: signal-port-description-droppod-launch
  defaultLinks: [ Trigger ]

# Падающая капсула: вертикальное падение (кадр 140x320, капсула касается земли в точке сущности). Настоящая
# капсула в это время скрыта, по окончании анимации она появляется на месте. По виду на каждую капсулу.
- type: entity
  abstract: true
  id: BaseStarHorizonDropPodLandingAnimation
  name: falling drop pod
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _StarHorizon/Effects/DropPod/landingpod.rsi
    state: expedition-landing
    # Центр кадра на 4.06 тайла выше и 1/16 тайла левее капсулы в последнем кадре (см. DropPodLandingGeometry).
    offset: -0.0625, 4.0625
    drawdepth: Objects
    noRot: true
  - type: TimedDespawn
    lifetime: 1.81
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BaseStarHorizonDropPodLandingAnimation
  id: StarHorizonDropPodLandingAnimation

- type: entity
  parent: BaseStarHorizonDropPodLandingAnimation
  id: StarHorizonDropPodLandingAnimationNanotrasen
  components:
  - type: Sprite
    state: nanotrasen-landing

- type: entity
  parent: BaseStarHorizonDropPodLandingAnimation
  id: StarHorizonDropPodLandingAnimationSyndicate
  components:
  - type: Sprite
    state: syndicate-landing

- type: entity
  parent: BaseStarHorizonDropPodLandingAnimation
  id: StarHorizonDropPodLandingAnimationAnrox
  components:
  - type: Sprite
    state: anrox-landing

# Клуб дыма по траектории падения и при ударе; растёт и тает (DropPodTrailSystem).
- type: entity
  id: StarHorizonDropPodSmokePuff
  name: smoke
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke_white
    drawdepth: Effects
    noRot: true
    scale: 0.35, 0.35
  - type: DropPodSmokePuff
    lifetime: 2.5
  - type: TimedDespawn
    lifetime: 2.5
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BaseComputerCircuitboard
  id: StarHorizonDropPodConsoleCircuitboard
  name: drop pod console board
  description: A computer printed circuit board for a drop pod console.
  components:
  - type: Sprite
    state: cpu_supply
  - type: ComputerBoard
    prototype: StarHorizonDropPodConsole

- type: entity
  parent: BaseComputer
  id: StarHorizonDropPodConsole
  name: drop pod console
  description: Sets the landing coordinates and launches the nearest drop pod.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: teleport
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
    board: StarHorizonDropPodConsoleCircuitboard
  - type: DropPodConsole
  # Капсулы привязываются к этому порту мультитулом (NetworkConfigurator), как любые устройства.
  - type: DeviceLinkSource
    ports:
    - DropPodLaunch
  - type: ActivatableUI
    key: enum.DropPodUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DropPodUiKey.Key:
        type: DropPodConsoleBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#ff9a30"
