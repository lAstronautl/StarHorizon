# Чёрный ящик задания «Чёрный ящик» (Retrieval) планетной экспедиции: стоит в самой дальней комнате данжа и мигает
# красным. Его активируют руками, затем качают данные, оставаясь в зоне вокруг него, пока идут волны.
- type: entity
  id: ExpeditionBlackBox
  name: black box
  description: The flight recorder of a lost vessel, still wired into the wreck. Downloading its data takes a while, and its signal will not go unnoticed.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _StarHorizon/Objects/Expedition/black_box.rsi
    layers:
    - state: icon
    - state: light
      shader: unshaded
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ExpeditionBlackBoxZone
  - type: PointLight
    color: "#FF3030"
    radius: 2.5
    energy: 1.5
  - type: LightBehaviour
    behaviours:
    - !type:PulseBehaviour
      interpolate: Nearest
      maxDuration: 1.0
      startValue: 0.2
      endValue: 1.5
      isLooped: true
      property: Energy
      enabled: true
