# Маяк эвакуации с экспедиции: неподвижный, к нему цепляются крюком-кошкой.
- type: entity
  id: StarHorizonExtractionBeacon
  name: маяк эвакуации
  description: За него цепляются крюком-кошкой. Скоро за ним прилетит корабль.
  components:
    - type: Clickable
    - type: InteractionOutline
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.4,0.25,0.1"
          density: 200
          hard: true
          layer:
            - Impassable
    - type: Sprite
      sprite: Objects/Tools/fulton.rsi
      drawdepth: SmallObjects
      noRot: true
      layers:
        - state: extraction_point
    - type: FultonBeacon
