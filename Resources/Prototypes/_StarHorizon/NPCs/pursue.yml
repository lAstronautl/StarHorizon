# Мобы волн экспедиции всегда знают, где игрок, и идут к нему (FollowTarget ставит PursuePlayerSystem).
# Ближний/дальний бой раньше погони: рядом с игроком они дерутся, вдали идут к нему напрямую.
- type: htnCompound
  id: PursuePlayerCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: FollowTarget
          operator: !type:MoveToOperator
            targetKey: FollowTarget
            rangeKey: MeleeRange
            # У A* лимит узлов: длинные пути иначе срывают план. Движение к цели ведёт steering.
            pathfindInPlanning: false
            removeKeyOnFinish: false

- type: htnCompound
  id: PursueMeleeCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: PursuePlayerCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# Дальники идут к игроку до дальности стрельбы, если его видно, а не видно (за стеной) или идут по ножке пути: вплотную.
- type: htnCompound
  id: PursuePlayerRangedCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: FollowTarget
          operator: !type:MoveToOperator
            targetKey: FollowTarget
            # PursueRange ставит PursuePlayerSystem: дальность стрельбы, только если игрок виден; иначе вплотную.
            rangeKey: PursueRange
            pathfindInPlanning: false
            removeKeyOnFinish: false

# Корень SimpleRangedHostileCompound (стрелки-животные) с погоней.
- type: htnCompound
  id: PursueRangedCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: InnateRangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: PursuePlayerRangedCompound
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# Корень SimpleHumanoidHostileCompound (гуманоиды со стволами) с погоней.
- type: htnCompound
  id: PursueHumanoidCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: RangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: PursuePlayerRangedCompound
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
